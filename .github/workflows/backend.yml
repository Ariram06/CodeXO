name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Codexo.slnx"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Codexo.slnx"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Codexo.slnx

      - name: Build
        run: dotnet build Codexo.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Codexo.slnx --no-build --configuration Release --verbosity normal
