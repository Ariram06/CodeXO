name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Build & Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Codexo.slnx

      - name: Build solution
        run: dotnet build Codexo.slnx --configuration Release --no-restore

      - name: Run unit & integration tests
        run: dotnet test Codexo.slnx --configuration Release --no-build --verbosity normal

  extension:
    name: Extension Build, Test & Package (Angular & MV3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'extension/package-lock.json'

      - name: Install extension dependencies
        run: npm --prefix extension ci

      - name: Run Vitest unit & integration tests
        run: npm --prefix extension test -- --watch=false

      - name: Build and package extension zip
        run: npm --prefix extension run package

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codexo-extension-v0.1.0
          path: extension/dist/codexo-extension-v0.1.0.zip
          retention-days: 14
